<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy Valorant</title>
  
  <!-- BEGIN FAVICON-->
  <link rel="apple-touch-icon" sizes="180x180" href="../img/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../img/favicon/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- END FAVICON-->

  <link rel="stylesheet" href="../css/login.css">

  <script src="../js/login.js"></script>
</head>
<body>
  <main>
    <h1>Fantasy Val</h1>
    <h2>Login</h2>
    <form id="loginForm">
      <div class="form_example">
        <label for="loginUsername">Enter your username:</label>
        <input id="loginUsername" name="login_username" type="text" />
      </div>
      <div class="form_example">
        <label for="loginPassword">Enter your password:</label>
        <input id="loginPassword" name="login_password" type="text" />
      </div>
      <input type="submit" value="Login" /> 
    </form>

    <h2>Register User</h2>
    <form id="registerForm">
      <div class="form_example">
        <label for="registerUsername">Enter a username:</label>
        <input id="registerUsername" name="register_username" type="text" />
      </div>
      <div class="form_example">
        <label for="registerPassword">Enter a password:</label>
        <input id="registerPassword" name="register_password" type="text" />
      </div>
      <input type="submit" value="Register User" /> 
    </form>
  </main>
</body>
</html>
